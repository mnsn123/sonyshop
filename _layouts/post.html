---
layout: default
---

<div class="post"> <!-- ✅ Required for infinite.js to find and append -->
  <li>
    <h2>{{ post.title }}</h2>
    <p class="meta">{{ post.date | date_to_string }}</p>

    <div class="post-content">
      {{ post.content }}
    </div>
  </li>

  <!-- Optional: post navigation logic (can stay inside this div) -->
</div>
